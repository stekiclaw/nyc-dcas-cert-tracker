name: NYC Open Data Python SODA2 smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/check_api_network.py"
      - "scripts/fetch_certifications.py"
      - "tests/test_fetch_certifications.py"
      - ".github/workflows/soda2-connectivity.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Python SODA2 fetch and offline tests (synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python fetcher unit tests
        run: python3 -m unittest discover -s tests -p test_fetch_certifications.py -v
      - name: DNS, HTTPS, JSON probe
        run: python3 scripts/check_api_network.py
      - name: Real populated SODA2 page with official order and anonymous output
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("dcas_fetch", "scripts/fetch_certifications.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          rows = mod.request_json({
              "$select": "exam_no,cert_issue_no,cert_date,cert_seq_no",
              "$where": "cert_date >= '2026-10-01T00:00:00'",
              "$order": "cert_date DESC, cert_issue_no DESC, cert_seq_no ASC, :id DESC",
              "$limit": "2", "$offset": "0"
          })
          assert len(rows) == 2, "Expected two official rows"
          print("Populated ordered SODA2 JSON page verified; no row contents logged.")
          PY
      - name: Real SODA2 filtered query with a fictional name (private temporary output)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python3 scripts/fetch_certifications.py \
            --first-name SYNTHETIC-UNKNOWN-PERSON \
            --last-name SAMPLE-DOES-NOT-EXIST \
            --exam 4034 \
            --title-code 13621 \
            --out "$tmp/private-test.json"
          python3 - "$tmp/private-test.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert isinstance(data["rows"], list)
          assert data["matched_count"] == 0, "Synthetic name unexpectedly matched"
          print("Filtered SODA2 GET, count and JSON parsing passed.")
          PY
