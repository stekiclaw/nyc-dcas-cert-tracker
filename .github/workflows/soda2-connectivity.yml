name: NYC Open Data SODA2 connectivity smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/check_api_network.py"
      - ".github/workflows/soda2-connectivity.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Public SODA2 connectivity (no personal data)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: DNS, HTTPS, JSON probe
        run: python3 scripts/check_api_network.py
